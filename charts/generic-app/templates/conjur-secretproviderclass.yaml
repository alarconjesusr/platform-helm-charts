{{- if .Values.conjur.enabled }}
{{- $account := required "conjur.account is required when conjur.enabled is true" .Values.conjur.account }}
{{- $applianceUrl := required "conjur.applianceUrl is required when conjur.enabled is true" .Values.conjur.applianceUrl }}
{{- $authnId := required "conjur.authnId is required when conjur.enabled is true" .Values.conjur.authnId }}
{{- $sslCertificate := required "conjur.sslCertificate is required when conjur.enabled is true" .Values.conjur.sslCertificate }}
{{- if empty .Values.conjur.secrets }}
{{- fail "conjur.secrets must contain at least one file-to-variable mapping when conjur.enabled is true" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "generic-app.conjurSecretProviderClassName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  provider: conjur
  parameters:
    conjur.org/configurationVersion: "0.2.0"
    account: {{ $account | quote }}
    applianceUrl: {{ $applianceUrl | quote }}
    authnId: {{ $authnId | quote }}
    sslCertificate: |
      {{- $sslCertificate | nindent 6 }}
{{- end }}
