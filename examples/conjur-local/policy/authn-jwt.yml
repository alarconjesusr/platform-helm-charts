---
- !policy
  id: conjur/authn-jwt/kube
  body:
    - !webservice
    - !variable
      id: public-keys
    - !variable
      id: issuer
    - !variable
      id: token-app-property
    - !permit
      role: !host /system:serviceaccount:conjur-csi-test:conjur-csi-test
      privilege: [read, authenticate]
      resource: !webservice
