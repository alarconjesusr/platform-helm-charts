image:
  repository: nginx
  tag: "1.16.0"

serviceAccount:
  create: true
  name: conjur-csi-test

conjur:
  enabled: true
  account: default
  applianceUrl: https://host.minikube.internal:8443
  authnId: authn-jwt/kube
  secretProviderClassName: conjur-csi-test-secrets
  mountPath: /mnt/secrets-store
  secrets:
    - file: db-password
      variable: db-credentials/password
