# Local-only Conjur OSS endpoint for CSI integration tests.
services:
  tls-certificate:
    image: cyberark/conjur
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - |
        test -s /certs/nginx.crt || openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
          -subj "/CN=host.minikube.internal" \
          -addext "subjectAltName=DNS:host.minikube.internal,DNS:localhost,IP:127.0.0.1" \
          -keyout /certs/nginx.key \
          -out /certs/nginx.crt
    volumes:
      - conjur-tls:/certs

  database:
    image: postgres:15
    environment:
      POSTGRES_HOST_AUTH_METHOD: password
      POSTGRES_PASSWORD: local-conjur-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - conjur-data:/var/lib/postgresql/data

  conjur:
    image: cyberark/conjur
    command: server
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:local-conjur-test@database/postgres
      CONJUR_AUTHENTICATORS: authn,authn-jwt/kube
      CONJUR_TELEMETRY_ENABLED: "false"
  proxy:
    image: nginx:alpine
    depends_on:
      tls-certificate:
        condition: service_completed_successfully
      conjur:
        condition: service_started
    ports:
      - "8443:443"
    volumes:
      - conjur-tls:/etc/nginx/tls:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  client:
    image: cyberark/conjur-cli:9
    entrypoint: ["sleep", "infinity"]
    depends_on:
      proxy:
        condition: service_started
    volumes:
      - ./policy:/policy:ro

volumes:
  conjur-data:
  conjur-tls:
